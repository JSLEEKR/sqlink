[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlink"
version = "1.0.0"
description = "Fluent SQL query builder with chain API, parameterized queries, and dialect support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "JSLEEKR", email = "93jslee@gmail.com" },
]
keywords = ["sql", "query-builder", "database", "orm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/JSLEEKR/sqlink"
Repository = "https://github.com/JSLEEKR/sqlink"
Issues = "https://github.com/JSLEEKR/sqlink/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/sqlink"]
